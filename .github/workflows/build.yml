name: Build

on:
  push:
  workflow_dispatch:

# Permite cancelar: un push nuevo sobre la misma rama cancela la corrida en curso.
# Ademas, siempre puedes cancelar manualmente desde la UI o con "gh run cancel".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug y release (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Decodificar keystore desde KEYSTORE_BASE64
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/twedmark-release.jks
          ls -l app/keystore

      - name: Crear keystore.properties desde secrets
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=app/keystore/twedmark-release.jks"
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > keystore.properties

      - name: Compilar debug y release (splits arm64-v8a y armeabi-v7a)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Listar APKs generados
        run: |
          ls -R app/build/outputs/apk

      - name: Subir APKs debug
        uses: actions/upload-artifact@v6
        with:
          name: TwedMark-debug-APKs
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 14

      - name: Subir APKs release firmados
        uses: actions/upload-artifact@v6
        with:
          name: TwedMark-release-APKs
          path: app/build/outputs/apk/release/
          if-no-files-found: error
          retention-days: 30

      - name: Subir mapping de R8 (release)
        uses: actions/upload-artifact@v6
        with:
          name: TwedMark-release-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn
          retention-days: 30

      - name: Subir reportes de problemas de Gradle
        uses: actions/upload-artifact@v6
        with:
          name: TwedMark-gradle-problems-reports
          path: build/reports/problems/
          if-no-files-found: warn
          retention-days: 14

      - name: Subir missing_rules.txt de R8 (si existe)
        uses: actions/upload-artifact@v6
        with:
          name: TwedMark-R8-missing-rules
          path: app/build/outputs/mapping/release/missing_rules.txt
          if-no-files-found: warn
          retention-days: 30